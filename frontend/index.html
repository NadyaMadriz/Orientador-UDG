<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orientador UDG - CUTonalá</title>
  <!-- Fuente Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Encabezado con estética CUTonalá (Naturaleza y Hoja) -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <div class="logo-icon">
            <!-- Icono de Hoja / Planta -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 1.4 9-1 8-8.2 9-8.4 9z"/>
              <path d="M11 20v-7"/>
            </svg>
          </div>
          <div>
            <h1 id="assistant-title">Orientador UDG</h1>
            <span class="badge-campus" id="institution-name">CUTonalá</span>
          </div>
        </div>
        <div class="status-indicator" id="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">Conectando...</span>
        </div>
      </div>
    </header>

    <!-- Área de Chat -->
    <main class="chat-container">
      <div class="messages-list" id="chat-messages">
        <!-- Los mensajes se agregarán aquí dinámicamente -->
      </div>

      <!-- Indicador de "Escribiendo..." -->
      <div class="typing-indicator hidden" id="typing-indicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <span>Orientador respondiendo...</span>
      </div>
    </main>

    <!-- Preguntas sugeridas (Chips) -->
    <div class="suggested-container">
      <div class="suggested-title">Sugerencias:</div>
      <div class="chips-scroll" id="suggested-chips">
        <!-- Chips dinámicos -->
      </div>
    </div>

    <!-- Área de Entrada de Mensaje -->
    <footer class="input-area">
      <form id="chat-form" class="input-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Escribe tu duda sobre tu clase o profesor..." 
          maxlength="1000"
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn" aria-label="Enviar mensaje">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="disclaimer-text" id="disclaimer-text">
        Esta orientación es informativa y basada en reglamentos de la Universidad de Guadalajara.
      </div>
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
